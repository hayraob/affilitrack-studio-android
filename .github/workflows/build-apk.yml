name: Build AffiliTrack Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare app
        run: |
          mkdir -p www
          HTML_FILE="$(find . -maxdepth 1 -type f -iname '*.html' -print -quit)"
          if [ -z "$HTML_FILE" ]; then
            echo "No HTML app file found in repository root."
            exit 1
          fi
          cp "$HTML_FILE" www/index.html
          cat > package.json <<'EOF'
          {
            "name": "affilitrack-studio",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.affilitrack.studio",
            "appName": "AffiliTrack Studio",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AffiliTrack-Studio-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
